services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    restart: unless-stopped
    shm_size: "512mb"
    networks:
      - tipi_main_network
    environment:
      TZ: ${TZ}
    ports:
      - ${APP_PORT}:8971
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/media:/media/frigate
    labels:
      runtipi.managed: true
      runtipi.appurn: frigate:_user
    hostname: frigate